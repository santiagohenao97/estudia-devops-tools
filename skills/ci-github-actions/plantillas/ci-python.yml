# Plantilla: pruebas de un proyecto Python. Copia a .github/workflows/ci.yml y ajusta el comando de pruebas.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip    # requiere requirements*.txt o pyproject.toml; bórralo si no hay dependencias
      - name: Instalar dependencias
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Correr pruebas
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee salida-pruebas.txt
        # con pytest:  python -m pytest -v 2>&1 | tee salida-pruebas.txt
      - name: Guardar la salida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salida-pruebas
          path: salida-pruebas.txt
